name: Publish Minnionise site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: minnionise-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static publish directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages || true
          git switch --orphan gh-pages-publish
          git rm -rf . >/dev/null 2>&1 || true
          cp -a _site/. .
          rm -rf _site
          git add -A
          git commit -m "Deploy Minnionise from ${GITHUB_SHA::7}"
          git push --force origin HEAD:gh-pages
