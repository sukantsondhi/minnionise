name: Assemble Minnionise v2 staging

on:
  push:
    branches: ["v2-build"]

permissions:
  contents: write

concurrency:
  group: minnionise-v2-assembly
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Assemble when upload is complete
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .build_v2/READY ]]; then
            echo "Staging bundle is not complete yet."
            exit 0
          fi

          cat .build_v2/archive.*.b64 | base64 -d > /tmp/minnionise-v2.tar.gz

          rm -rf assets docs local_bridge
          rm -f index.html styles.css app.js favicon.svg manifest.webmanifest sw.js 404.html README.md LICENSE .gitignore .nojekyll
          tar -xzf /tmp/minnionise-v2.tar.gz -C .

          rm -rf .build_v2
          rm -f .github/workflows/assemble-v2.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Build Minnionise v2 local-AI experience"
          git push origin HEAD:v2-build
