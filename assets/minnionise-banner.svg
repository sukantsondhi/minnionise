  <text x="90" y="100" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="6" fill="#ffd928">LOCAL-FIRST • BANANA-LINGUISTICS</text>
  <text x="85" y="215" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="94" font-weight="950" letter-spacing="-5" fill="#ffffff">MINNION<tspan fill="#ffd928">ISE</tspan></text>
  <text x="91" y="280" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="600" fill="#aeb6c5">Turn normal sentences into playful Minnionese — then learn to say them locally.</text>
